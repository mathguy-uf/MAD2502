name: PEP 8 repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair known notebook issues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load_notebook(path_string):
              path = Path(path_string)
              return path, json.loads(path.read_text(encoding="utf-8"))

          def save_notebook(path, notebook):
              path.write_text(
                  json.dumps(notebook, indent=1, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          path, notebook = load_notebook("lectures/02_numpy_basics.ipynb")
          for cell in notebook["cells"]:
              source = cell.get("source", "")
              text = "".join(source) if isinstance(source, list) else source
              if "elementwise:" in text and "matrix product:" in text:
                  cell["source"] = (
                      "A = np.array([[1, 2], [3, 4]])\n"
                      "B = np.array([[3, 4], [5, 6]])\n"
                      "print(\"elementwise:\")\n"
                      "print(A * B)\n"
                      "print(\"matrix product:\")\n"
                      "print(A @ B)"
                  )
          save_notebook(path, notebook)

          path, notebook = load_notebook("lectures/01_python_basics.ipynb")
          for cell in notebook["cells"]:
              source = cell.get("source", "")
              text = "".join(source) if isinstance(source, list) else source
              if "(1 or False) == True" in text:
                  cell["source"] = text.replace(
                      "(1 or False) == True",
                      "bool(1 or False)",
                  )
          save_notebook(path, notebook)

          path, notebook = load_notebook("lectures/02_variables_data_structures.ipynb")
          for cell in notebook["cells"]:
              source = cell.get("source", "")
              text = "".join(source) if isinstance(source, list) else source
              if "A bad variable name can hide a built-in function" in text:
                  cell["source"] = (
                      "print(\"This works!\")\n\n"
                      "# Avoid using built-in function names for your own variables.\n"
                      "example_value = 5\n"
                      "print(\"Suppose this value were assigned to the name `print`:\", "
                      "example_value)\n"
                      "print(\"That would hide Python's built-in print function.\")"
                  )
          save_notebook(path, notebook)

          path, notebook = load_notebook("examples/collections.ipynb")
          for cell in notebook["cells"]:
              source = cell.get("source", "")
              text = "".join(source) if isinstance(source, list) else source
              if "divisors = ()  # the empty tuple" in text:
                  cell["source"] = text.replace(
                      "    divisors = ()  # the empty tuple\n",
                      "",
                  )
          save_notebook(path, notebook)

          path = Path("lectures/09_floating_point.ipynb")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "=45.$$\n\nEach bit contributes",
              "=45.$$\\n\\nEach bit contributes",
          )
          json.loads(text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply safe lint fixes
        run: ruff check applied_data capstone examples lectures maintenance templates --fix || true

      - name: Format active Python code
        run: ruff format applied_data capstone examples lectures maintenance templates

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Repair PEP 8 issues in active course code"
          git push

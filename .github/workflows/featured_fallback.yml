name: Featured lecture fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update static featured fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '>Continue the course</a>': '>Explore a featured lecture</a>',
              '>CURRENTLY IN CLASS</div>': '>FEATURED FROM THE COURSE</div>',
              '<p class="section-kicker">Chapter 12</p>': '<p class="section-kicker">Chapter 9</p>',
              '<h2 id="current-title">Graphics &amp; Visualization</h2>': '<h2 id="current-title">Floating-Point Arithmetic</h2>',
              '<p>Build clear plots with Matplotlib, work with interactive figures, and see how computation becomes something you can communicate visually.</p>': '<p>See why computers cannot represent every real number exactly, explore IEEE-754, and learn why numerical comparisons need tolerance.</p>',
              '<span class="status-pill">Current unit</span>': '<span class="status-pill">Featured notebook</span>',
              '<span class="button button-disabled" aria-disabled="true">Current notebook coming soon</span>': '<a class="button button-primary" href="https://github.com/mathguy-uf/MAD2502/blob/main/lectures/09_floating_point.ipynb">View on GitHub</a>\n              <a class="button button-secondary" href="https://colab.research.google.com/github/mathguy-uf/MAD2502/blob/main/lectures/09_floating_point.ipynb">Run in Colab</a>\n              <a class="button button-secondary" href="https://mybinder.org/v2/gh/mathguy-uf/MAD2502/main?urlpath=lab/tree/lectures/09_floating_point.ipynb">Launch Binder</a>',
          }

          changed = text
          for old, new in replacements.items():
              changed = changed.replace(old, new)

          if changed == text:
              print("Static featured fallback already updated.")
          else:
              path.write_text(changed, encoding="utf-8")
          PY

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace current lecture with featured fallback"
          git push
